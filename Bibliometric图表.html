<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Bibliometric Analysis Charts</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background:#fff; margin:0; padding:24px; }
  .wrap { width: 900px; margin: 0 auto; }
  h2 { text-align:center; font-size:15px; color:#333; font-weight:600; margin:26px 0 6px;}
  .fig { display:flex; justify-content:center; }
  .note { text-align:center; font-size:11px; color:#888; margin-top:14px;}
</style>
</head>
<body>
<div class="wrap">

<!-- ================= Figure 2: Yearly distribution ================= -->
<h2>Fig. 2. Yearly Distribution of the Included 112 Studies (2018–2025)</h2>
<div class="fig">
<svg width="760" height="400" viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .axis { stroke:#333; stroke-width:1.2; }
    .grid { stroke:#ddd; stroke-width:0.8; }
    .bar { fill:#4a7ebb; }
    .bar:hover { fill:#2c5a94; }
    .lab { font-size:12px; fill:#333; text-anchor:middle; }
    .val { font-size:11px; fill:#2c3e50; text-anchor:middle; font-weight:bold; }
    .pct { font-size:10px; fill:#777; text-anchor:middle; }
    .ylab { font-size:11px; fill:#555; text-anchor:end; }
    .caption { font-size:12px; fill:#555; text-anchor:middle; font-style:italic;}
  </style>
  <!-- y gridlines every 5 -->
  <line class="grid" x1="70" y1="320" x2="720" y2="320"/>
  <line class="grid" x1="70" y1="260" x2="720" y2="260"/>
  <line class="grid" x1="70" y1="200" x2="720" y2="200"/>
  <line class="grid" x1="70" y1="140" x2="720" y2="140"/>
  <line class="grid" x1="70" y1="80"  x2="720" y2="80"/>
  <text class="ylab" x="62" y="324">0</text>
  <text class="ylab" x="62" y="264">5</text>
  <text class="ylab" x="62" y="204">10</text>
  <text class="ylab" x="62" y="144">15</text>
  <text class="ylab" x="62" y="84">20</text>
  <text class="ylab" x="62" y="44">25</text>
  <line class="grid" x1="70" y1="40" x2="720" y2="40"/>
  <!-- axes -->
  <line class="axis" x1="70" y1="40" x2="70" y2="320"/>
  <line class="axis" x1="70" y1="320" x2="720" y2="320"/>
  <!-- bars: scale = 12px per paper; baseline y=320 -->
  <!-- 2018: 8 -->
  <rect class="bar" x="96"  y="224" width="52" height="96"/>
  <text class="val" x="122" y="216">8</text><text class="pct" x="122" y="204">7.1%</text>
  <text class="lab" x="122" y="340">2018</text>
  <!-- 2019: 12 -->
  <rect class="bar" x="176" y="176" width="52" height="144"/>
  <text class="val" x="202" y="168">12</text><text class="pct" x="202" y="156">10.7%</text>
  <text class="lab" x="202" y="340">2019</text>
  <!-- 2020: 15 -->
  <rect class="bar" x="256" y="140" width="52" height="180"/>
  <text class="val" x="282" y="132">15</text><text class="pct" x="282" y="120">13.4%</text>
  <text class="lab" x="282" y="340">2020</text>
  <!-- 2021: 22 -->
  <rect class="bar" x="336" y="56" width="52" height="264"/>
  <text class="val" x="362" y="48">22</text><text class="pct" x="362" y="36">19.6%</text>
  <text class="lab" x="362" y="340">2021</text>
  <!-- 2022: 24 -->
  <rect class="bar" x="416" y="32" width="52" height="288"/>
  <text class="val" x="442" y="24">24</text><text class="pct" x="442" y="12">21.4%</text>
  <text class="lab" x="442" y="340">2022</text>
  <!-- 2023: 20 -->
  <rect class="bar" x="496" y="80" width="52" height="240"/>
  <text class="val" x="522" y="72">20</text><text class="pct" x="522" y="60">17.9%</text>
  <text class="lab" x="522" y="340">2023</text>
  <!-- 2024: 8 -->
  <rect class="bar" x="576" y="224" width="52" height="96"/>
  <text class="val" x="602" y="216">8</text><text class="pct" x="602" y="204">7.1%</text>
  <text class="lab" x="602" y="340">2024</text>
  <!-- 2025: 3 (until Mar) -->
  <rect class="bar" x="656" y="284" width="52" height="36"/>
  <text class="val" x="682" y="276">3</text><text class="pct" x="682" y="264">2.7%</text>
  <text class="lab" x="682" y="340">2025*</text>
  <text class="caption" x="395" y="375">*2025 covers January to March only (search cutoff: 2025-03-01). Y-axis: number of studies.</text>
</svg>
</div>

<!-- ================= Figure 3: Venue distribution (pie) ================= -->
<h2>Fig. 3. Venue Distribution of the Included Studies</h2>
<div class="fig">
<svg width="640" height="340" viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg">
  <style>
    .plab { font-size:12.5px; fill:#fff; text-anchor:middle; font-weight:bold;}
    .leg { font-size:13px; fill:#333; }
    .legs { font-size:11.5px; fill:#666; }
  </style>
  <!-- CCF-A: 0° -> 167.04° (46.4%) -->
  <path d="M170,170 L170,50 A120,120 0 0 1 196.9,286.9 Z" fill="#2c5a94"/>
  <!-- CCF-B: 167.04° -> 257.04° (25.0%) -->
  <path d="M170,170 L196.9,286.9 A120,120 0 0 1 53.1,196.9 Z" fill="#7aa6d6"/>
  <!-- SCI: 257.04° -> 360° (28.6%) -->
  <path d="M170,170 L53.1,196.9 A120,120 0 0 1 170,50 Z" fill="#d98e4a"/>
  <!-- in-slice labels -->
  <text class="plab" x="249" y="166">46.4%</text>
  <text class="plab" x="122" y="248">25.0%</text>
  <text class="plab" x="113" y="118">28.6%</text>
  <!-- legend -->
  <rect x="350" y="90" width="16" height="16" fill="#2c5a94"/>
  <text class="leg" x="376" y="103">CCF-A conferences</text>
  <text class="legs" x="376" y="120">n = 52 (S&amp;P, CCS, USENIX Sec, NDSS, ICSE, NeurIPS…)</text>
  <rect x="350" y="160" width="16" height="16" fill="#7aa6d6"/>
  <text class="leg" x="376" y="173">CCF-B conferences</text>
  <text class="legs" x="376" y="190">n = 28 (ISSTA, ACSAC, RAID…)</text>
  <rect x="350" y="230" width="16" height="16" fill="#d98e4a"/>
  <text class="leg" x="376" y="243">SCI/SCIE journals</text>
  <text class="legs" x="376" y="260">n = 32 (TSE, TOSEM, TIFS, TDSC, C&amp;S…)</text>
</svg>
</div>

<!-- ================= Figure 4: Technical route distribution ================= -->
<h2>Fig. 4. Distribution of Dominant Technical Routes</h2>
<div class="fig">
<svg width="760" height="320" viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg">
  <style>
    .axis2 { stroke:#333; stroke-width:1.2; }
    .grid2 { stroke:#ddd; stroke-width:0.8; }
    .hb { fill:#4a7ebb; }
    .hlab { font-size:12.5px; fill:#333; text-anchor:end; }
    .hval { font-size:12px; fill:#2c3e50; font-weight:bold; }
    .hpct { font-size:10.5px; fill:#777; }
  </style>
  <!-- x gridlines: scale 14px per paper, max 35 -->
  <line class="grid2" x1="230" y1="20" x2="230" y2="280"/>
  <line class="grid2" x1="370" y1="20" x2="370" y2="280"/>
  <line class="grid2" x1="510" y1="20" x2="510" y2="280"/>
  <line class="axis2" x1="230" y1="20" x2="230" y2="280"/>
  <line class="axis2" x1="230" y1="280" x2="650" y2="280"/>
  <!-- GNN 32 -->
  <text class="hlab" x="220" y="52">Graph Neural Network</text>
  <rect class="hb" x="230" y="32" width="448" height="30"/>
  <text class="hval" x="686" y="52">32</text><text class="hpct" x="712" y="52">28.6%</text>
  <!-- Transformer 24 -->
  <text class="hlab" x="220" y="102">Transformer</text>
  <rect class="hb" x="230" y="82" width="336" height="30"/>
  <text class="hval" x="574" y="102">24</text><text class="hpct" x="600" y="102">21.4%</text>
  <!-- LLM 20 -->
  <text class="hlab" x="220" y="152">Large Language Model</text>
  <rect class="hb" x="230" y="132" width="280" height="30"/>
  <text class="hval" x="518" y="152">20</text><text class="hpct" x="544" y="152">17.9%</text>
  <!-- Traditional ML 18 -->
  <text class="hlab" x="220" y="202">Traditional ML</text>
  <rect class="hb" x="230" y="182" width="252" height="30"/>
  <text class="hval" x="490" y="202">18</text><text class="hpct" x="516" y="202">16.1%</text>
  <!-- Others 18 -->
  <text class="hlab" x="220" y="252">Others (FL, RL, hybrid)</text>
  <rect class="hb" x="230" y="232" width="252" height="30" fill="#8fb8de"/>
  <text class="hval" x="490" y="252">18</text><text class="hpct" x="516" y="252">16.1%</text>
  <text class="hlab" x="445" y="305" text-anchor="middle" style="font-size:12px;fill:#555;font-style:italic;text-anchor:middle;">Number of studies. Multi-technique papers are counted by their dominant route.</text>
</svg>
</div>

<p class="note">All counts sum to n = 112. Open in browser → screenshot at 2× zoom for 300-dpi-equivalent insertion into Word/LaTeX.</p>
</div>
</body>
</html>
